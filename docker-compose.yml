services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fxpay
      POSTGRES_USER: fxpay
      POSTGRES_PASSWORD: fxpay
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxpay"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://fxpay:fxpay@db:5432/fxpay
      SECRET_KEY: change-me-in-production
      DEBUG: "0"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]
volumes:
  pgdata:
